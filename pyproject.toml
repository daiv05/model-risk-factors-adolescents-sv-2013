[tool.poetry]
package-mode = false

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelo-factores-riesgo-adolescentes-sv"
version = "0.1.0"
description = "ML analysis of adolescent risk factors in El Salvador using WHO GSHS 2013 data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "David Deras", email = "davidderas50@gmail.com" },
]
keywords = ["machine-learning", "public-health", "adolescents", "el-salvador", "WHO", "GSHS"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.4",
  "imbalanced-learn>=0.12",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "streamlit>=1.35",
  "jupyter>=1.0",
  "ipykernel>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "black>=24.0",
  "ruff>=0.4",
]

[project.scripts]
train-models = "src.models.train:main"
run-benchmark = "src.analysis.benchmark:main"
run-ablation = "src.analysis.ablation:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
